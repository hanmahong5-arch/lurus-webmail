# Local development Stalwart config
# Mirrors production but with relaxed security for testing

[server]
hostname = "mail.lurus.local"
max-connections = 1024

[store."rocksdb"]
type = "rocksdb"
path = "/opt/stalwart-mail/data"
compression = "lz4"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[directory."internal"]
type = "internal"
store = "rocksdb"

[directory."internal".options]
catch-all = true
subaddressing = true

[session.ehlo]
require = true
reject-non-fqdn = false

[session.auth]
mechanisms = ["plain", "login"]
require = true

[session.rcpt]
max-recipients = 100

[queue]
path = "/opt/stalwart-mail/queue"
hash = 64

[queue.schedule]
retry = ["2m", "5m", "10m"]
notify = ["1d"]
expire = "2d"

[queue.outbound]
hostname = "mail.lurus.local"
next-hop = false

# Relaxed security for local dev
[auth.spf.verify]
ehlo = "relaxed"
mail-from = "relaxed"

[auth.dkim]
verify = "relaxed"
sign = true

[auth.dmarc]
verify = "relaxed"

[auth.arc]
verify = "relaxed"
seal = true

[auth.iprev]
verify = "relaxed"

[spam-filter]
enable = false

[imap]
max-request-size = 52428800

[imap.timeout]
authenticated = "30m"
anonymous = "1m"
idle = "30m"

[jmap]
max-request-size = 52428800
max-upload-size = 52428800

[server.listener."http"]
bind = ["[::]:8080"]
protocol = "http"

[web-admin]
enable = true

# Self-signed for local dev (auto-generated by Stalwart)
[server.listener."smtp"]
bind = ["[::]:25"]
protocol = "smtp"

[server.listener."submission"]
bind = ["[::]:587"]
protocol = "smtp"
tls.implicit = false

[server.listener."submissions"]
bind = ["[::]:465"]
protocol = "smtp"
tls.implicit = true

[server.listener."imap"]
bind = ["[::]:143"]
protocol = "imap"
tls.implicit = false

[server.listener."imaps"]
bind = ["[::]:993"]
protocol = "imap"
tls.implicit = true

[tracing."stdout"]
type = "stdout"
level = "debug"
ansi = true
enable = true

[metrics]
prometheus = true
